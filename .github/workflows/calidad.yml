# En cada PR: formato, clippy, pruebas (regresion y propiedad) y mutacion de las
# lineas cambiadas, en Linux. El fuzzing y la
# mutacion (cientos de minutos por corrida) estan en profundo.yml, a mano, y la
# mutacion completa se corre en local antes de fusionar (ver HOJA-DE-RUTA.md).
name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

defaults:
  run:
    working-directory: codigo

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Más casos que en local: la CI puede gastar el tiempo.
      PROPTEST_CASES: "2048"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python scripts/umbral_mutacion.py --autoprueba

  # Mutación sólo de las líneas que cambia el PR, en cuatro fragmentos: minutos en
  # un PR chico, no las horas de la corrida completa de profundo.yml. Mismo
  # umbral: 90 % y ningún timeout, juzgado sobre los fragmentos juntos.
  mutacion-del-pr:
    name: Mutación del PR ${{ matrix.fragmento }}/4
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        fragmento: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - name: Diff del PR contra su base
        run: git diff --relative "origin/${{ github.base_ref }}...HEAD" -- src > "$RUNNER_TEMP/pr.diff"
      - name: Mutantes del diff
        run: |
          if [ "$(cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --shard ${{ matrix.fragmento }}/4 --list | wc -l)" -eq 0 ]; then
            echo "sin mutantes en este fragmento"
            exit 0
          fi
          cargo test --locked --no-run
          status=0
          cargo mutants --cargo-arg=--locked --in-diff "$RUNNER_TEMP/pr.diff" --shard ${{ matrix.fragmento }}/4 -j 2 || status=$?
          test "$status" -eq 0 || test "$status" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutacion-del-pr-${{ matrix.fragmento }}
          path: codigo/mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  umbral-del-pr:
    name: Umbral de mutación del PR
    # always(): si un fragmento falla o se corta, este trabajo corre igual y falla;
    # salteado quedaría como «no hacía falta», que es lo que pasa fuera de un PR.
    if: always() && github.event_name == 'pull_request'
    needs: mutacion-del-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.mutacion-del-pr.result }}" = success
        working-directory: .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutacion-del-pr-*
          path: ${{ runner.temp }}/mutacion
      - name: Umbral sobre los fragmentos que tuvieron mutantes
        run: |
          shopt -s nullglob
          reportes=("$RUNNER_TEMP"/mutacion/*/outcomes.json)
          if [ "${#reportes[@]}" -eq 0 ]; then
            echo "el PR no cambia codigo mutable"
            exit 0
          fi
          python scripts/umbral_mutacion.py "${reportes[@]}"

  calidad:
    name: Calidad
    if: always()
    needs: [pruebas, umbral-del-pr]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.pruebas.result }}" = success
        working-directory: .
      - run: test "${{ needs.umbral-del-pr.result }}" = success || test "${{ needs.umbral-del-pr.result }}" = skipped
        working-directory: .

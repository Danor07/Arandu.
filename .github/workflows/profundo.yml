name: Profundo

# Fuzzing y mutacion completos, a pedido: se lanzan desde la pestana Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profundo-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

defaults:
  run:
    working-directory: codigo

jobs:
  fuzz:
    name: Fuzzing ${{ matrix.objetivo }}
    strategy:
      fail-fast: false
      matrix:
        objetivo: [captura, consulta, adaptador]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Cinco minutos de fuzzing
        run: cargo fuzz run ${{ matrix.objetivo }} -- -max_total_time=300 -rss_limit_mb=2048
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: fuzz-${{ matrix.objetivo }}
          path: codigo/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # cargo-mutants sale con 2 si sobrevive algún mutante: el umbral común
  # decide después, sobre todos los fragmentos juntos.
  mutacion:
    name: Mutación ${{ matrix.fragmento }}/8
    strategy:
      fail-fast: false
      matrix:
        fragmento: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - name: Compilar una vez sin mutar
        run: cargo test --locked --no-run
      - name: Fragmento de mutantes
        run: |
          status=0
          cargo mutants --cargo-arg=--locked --shard ${{ matrix.fragmento }}/8 -j 2 || status=$?
          test "$status" -eq 0 || test "$status" -eq 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutacion-${{ matrix.fragmento }}
          path: codigo/mutants.out/
          if-no-files-found: ignore
          retention-days: 14

  umbral-mutacion:
    name: Umbral de mutación
    needs: mutacion
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutacion-*
          path: ${{ runner.temp }}/mutacion
      - run: python scripts/umbral_mutacion.py "$RUNNER_TEMP"/mutacion/*/outcomes.json
